<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유니락 바코드 스캐너 웹페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>유니락 바코드 스캐너</h1>

    <div class="header-section">
        <div class="customer-select-group">
            <label for="customerSelect">고객사 선택 :</label>
            <select id="customerSelect"></select>
        </div>
        <div class="btn-group-top">
            <button class="btn-excel" onclick="exportToExcel()">엑셀 저장</button>
            <button class="btn-clear" onclick="clearAllData()">전체 비우기</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">NO</th>
                    <th style="width: 30%;">고객사</th>
                    <th style="width: 40%;">품목코드</th>
                    <th style="width: 15%;">삭제</th>
                </tr>
            </thead>
            <tbody id="scanTableBody">
                <!-- 스캔 데이터 동적 삽입 -->
            </tbody>
        </table>
    </div>

    <div class="input-section">
    <input type="text" 
           id="barcodeInput" 
           placeholder="바코드 스캔 대기 중..." 
           autofocus 
           inputmode="none" 
           autocomplete="off" 
           spellcheck="false">
    <button class="btn-submit" onclick="addBarcode()">입력</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
